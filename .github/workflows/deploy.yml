name: Deploy Represent Me

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: represent-me-production
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}
      - name: Trust deployment host
        run: ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> "$HOME/.ssh/known_hosts"
      - name: Update checkout and restart isolated stack
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "set -eu; test -d '$DEPLOY_PATH/.git'; git -C '$DEPLOY_PATH' fetch origin main; git -C '$DEPLOY_PATH' checkout -q main; git -C '$DEPLOY_PATH' pull --ff-only origin main; cd '$DEPLOY_PATH'; docker compose up -d --build --remove-orphans; docker compose ps"
